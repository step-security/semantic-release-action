name: Unit Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

jobs:
  unit-test:
    permissions:
      contents: read  # for actions/checkout to fetch code
    name: unit-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Node 22 is the oldest line satisfying the lockfile engines
      # (^22.14.0 || >=24.10.0); Node 24 matches the action runtime.
      # windows-latest guards the shell-free npm resolution in runNpm.js:
      # the action runtime is the runner's Node, which does not bundle
      # npm (#332)
      matrix:
        node-version: [22, 24]
        os: ${{ fromJSON(github.actor == 'dependabot[bot]' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test
